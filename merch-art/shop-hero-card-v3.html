<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1350px;height:1350px;overflow:hidden;background:#f4f4f0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#111;position:relative}
.stripe{position:absolute;left:0;right:0;height:64px;background:repeating-linear-gradient(135deg,#ffd400 0 40px,#111 40px 80px)}
.top{top:0}.bot{bottom:0}
.frame{position:absolute;left:56px;top:120px;right:56px;bottom:120px;border:6px solid #111}
.kicker{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:26px;letter-spacing:.34em;font-weight:700;text-transform:uppercase}
.seal{position:absolute;left:50%;top:225px;width:560px;height:560px;margin-left:-280px;background:url(print-seal.png) center/contain no-repeat}
h1{position:absolute;left:100px;right:100px;top:820px;text-align:center;font-size:118px;line-height:.95;font-weight:800;letter-spacing:-.03em;text-transform:uppercase}
h1 b{background:#ffd400;padding:0 14px;display:inline-block}
.fine{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:#444}
</style></head><body>
<div class="stripe top"></div><div class="stripe bot"></div><div class="frame"></div>
<div class="kicker">Official merchandise of the warning</div>
<div class="seal"></div>
<h1>This is your<br><b>only</b> warning.</h1>
<div class="fine">Every purchase funds the continued operation of this notice</div>
</body></html>
